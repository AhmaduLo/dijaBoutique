name: CI — Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw verify -B
        env:
          SPRING_PROFILES_ACTIVE: test
          # jwt.secret n'a pas de valeur par defaut (${JWT_SECRET} sans fallback) — obligatoire
          # pour que le contexte Spring demarre. Valeur factice, jamais utilisee hors CI.
          JWT_SECRET: ci-test-only-secret-key-never-used-outside-github-actions-0000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7
