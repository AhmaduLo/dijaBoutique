name: Backup MySQL → Backblaze B2

# Backup automatique de la BDD MySQL Railway vers Backblaze B2 (stockage
# compatible S3 — clé d'accès stable, pas d'expiration comme un token OAuth).
#
# Déclenchement :
#   - Automatique : tous les jours à 03:00 UTC (04:00 ou 05:00 heure Sénégal selon DST)
#   - Manuel : onglet "Actions" du repo → "Backup MySQL → Backblaze B2" → "Run workflow"
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   MYSQL_PUBLIC_URL     → URL complète depuis Railway → MySQL → Variables
#                          (format mysql://USER:PASS@HOST:PORT/DATABASE — la PUBLIQUE,
#                          pas l'INTERNE qui n'est pas accessible depuis GitHub)
#   B2_KEY_ID            → keyID de la clé d'application Backblaze
#   B2_APPLICATION_KEY   → applicationKey de la clé d'application Backblaze
#   B2_ENDPOINT          → endpoint régional (ex: s3.eu-central-003.backblazeb2.com)
#   B2_BUCKET            → nom du bucket (ex: easystock-backups)
#
# Rétention : 30 backups les plus récents (les plus anciens sont supprimés du bucket).

on:
  schedule:
    - cron: '0 3 * * *'   # tous les jours à 3h UTC
  workflow_dispatch:       # bouton manuel "Run workflow"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le client MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client gzip

      - name: Dumper la BDD
        env:
          MYSQL_PUBLIC_URL: ${{ secrets.MYSQL_PUBLIC_URL }}
        run: |
          # pipefail : si mysqldump plante, gzip ne masque plus l'erreur
          set -eo pipefail

          # Parse mysql://USER:PASS@HOST:PORT/DATABASE en 5 variables
          # Plus robuste qu'avoir 5 secrets séparés à copier-coller à la main.
          if [ -z "$MYSQL_PUBLIC_URL" ]; then
            echo "::error::Le secret MYSQL_PUBLIC_URL est vide. Copier la valeur de Railway → MySQL → Variables → MYSQL_PUBLIC_URL."
            exit 1
          fi

          # Format attendu : mysql://user:password@host:port/database
          NO_PROTOCOL="${MYSQL_PUBLIC_URL#mysql://}"
          USER_PASS="${NO_PROTOCOL%@*}"
          HOST_PORT_DB="${NO_PROTOCOL#*@}"
          DB_USER="${USER_PASS%%:*}"
          DB_PASS="${USER_PASS#*:}"
          HOST_PORT="${HOST_PORT_DB%/*}"
          DB_NAME="${HOST_PORT_DB#*/}"
          DB_HOST="${HOST_PORT%:*}"
          DB_PORT="${HOST_PORT#*:}"

          echo "Connexion à ${DB_HOST}:${DB_PORT} / base ${DB_NAME} (user=${DB_USER})"

          TIMESTAMP=$(date -u +'%Y-%m-%d_%Hh%Mm')
          FILENAME="easystock-backup-${TIMESTAMP}.sql.gz"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

          MYSQL_PWD="$DB_PASS" mysqldump \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --user="$DB_USER" \
            --single-transaction \
            --quick \
            --routines \
            --triggers \
            --no-tablespaces \
            --set-gtid-purged=OFF \
            "$DB_NAME" \
            | gzip -9 > "${FILENAME}"

          SIZE_BYTES=$(stat -c%s "${FILENAME}")
          SIZE=$(ls -lh "${FILENAME}" | awk '{print $5}')

          # Sanity check : un dump valide fait toujours >1 KB (rien que les CREATE TABLE)
          if [ "${SIZE_BYTES}" -lt 1024 ]; then
            echo "::error::❌ Dump anormalement petit (${SIZE_BYTES} octets) — mysqldump a échoué."
            exit 1
          fi

          echo "✅ Dump créé : ${FILENAME} (${SIZE})"

      - name: Uploader sur Backblaze B2 + rotation
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_ENDPOINT:           ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET:             ${{ secrets.B2_BUCKET }}
          BACKUP_FILE:           ${{ env.BACKUP_FILE }}
        run: |
          set -eo pipefail
          MAX_BACKUPS=30  # rotation : garde les 30 plus récents

          if [ -z "$B2_BUCKET" ] || [ -z "$B2_ENDPOINT" ]; then
            echo "::error::B2_BUCKET ou B2_ENDPOINT manquant(s) dans les secrets."
            exit 1
          fi

          ENDPOINT_URL="https://${B2_ENDPOINT}"
          # Le CLI AWS exige une région même pour un endpoint tiers — on extrait
          # celle de B2 depuis l'endpoint (ex: s3.eu-central-003.backblazeb2.com → eu-central-003).
          export AWS_DEFAULT_REGION="${B2_ENDPOINT#s3.}"
          AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION%.backblazeb2.com}"
          export AWS_DEFAULT_REGION

          # 1) Upload
          aws s3 cp "${BACKUP_FILE}" "s3://${B2_BUCKET}/${BACKUP_FILE}" --endpoint-url "${ENDPOINT_URL}"
          echo "✅ Upload OK : ${BACKUP_FILE}"

          # 2) Rotation : le nom de fichier contient un timestamp ISO-triable
          # (easystock-backup-YYYY-MM-DD_HHhMMm.sql.gz), donc trier les noms =
          # trier chronologiquement, pas besoin d'interroger les métadonnées.
          ALL_BACKUPS=$(aws s3 ls "s3://${B2_BUCKET}/" --endpoint-url "${ENDPOINT_URL}" \
            | awk '{print $4}' | grep '^easystock-backup-' | sort)
          TOTAL=$(echo "$ALL_BACKUPS" | grep -c . || true)
          echo "📦 ${TOTAL} backup(s) dans le bucket"

          if [ "$TOTAL" -gt "$MAX_BACKUPS" ]; then
            TO_DELETE_COUNT=$((TOTAL - MAX_BACKUPS))
            TO_DELETE=$(echo "$ALL_BACKUPS" | head -n "$TO_DELETE_COUNT")
            for f in $TO_DELETE; do
              aws s3 rm "s3://${B2_BUCKET}/${f}" --endpoint-url "${ENDPOINT_URL}"
              echo "🗑️  Supprimé : ${f}"
            done
            echo "✅ Rotation : ${TO_DELETE_COUNT} ancien(s) backup(s) supprimé(s)"
          else
            echo "ℹ️  Rotation non nécessaire (< ${MAX_BACKUPS} backups)"
          fi

      - name: Nettoyer les fichiers temporaires
        if: always()
        run: |
          rm -f easystock-backup-*.sql.gz

      - name: Résumé
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice::✅ Backup MySQL réussi : ${{ env.BACKUP_FILE }}"
          else
            echo "::error::❌ Backup MySQL ÉCHOUÉ. Vérifier les logs ci-dessus."
          fi
